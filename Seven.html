<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seven</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
    }

    .desc {
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    canvas {
      background: #000;
      border: 3px solid #444;
      border-radius: 14px;
    }

    .message {
      margin-top: 18px;
      font-size: 1.4rem;
      font-weight: bold;
      color: #ffd93d;
      min-height: 40px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>팩맨 게임</h1>
    <div class="desc">10초만 생존하면 됩니다.</div>
    <canvas id="game" width="420" height="420"></canvas>
    <div class="message" id="message"></div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const message = document.getElementById("message");

    let pacman = {
      x: 210,
      y: 210,
      r: 14,
      speed: 4,
      dx: 0,
      dy: 0,
      mouth: 0
    };

    let ghosts = [
      { x: 40, y: 40, r: 14, dx: 2.2, dy: 2.0, color: "#ff4d4d" },
      { x: 380, y: 40, r: 14, dx: -2.0, dy: 2.4, color: "#4da6ff" },
      { x: 40, y: 380, r: 14, dx: 2.4, dy: -2.0, color: "#ff7bff" }
    ];

    let startTime = Date.now();
    let gameOver = false;
    let gameClear = false;

    function drawPacman() {
      ctx.save();
      ctx.translate(pacman.x, pacman.y);

      let angle = 0;
      if (pacman.dx > 0) angle = 0;
      else if (pacman.dx < 0) angle = Math.PI;
      else if (pacman.dy > 0) angle = Math.PI / 2;
      else if (pacman.dy < 0) angle = -Math.PI / 2;

      ctx.rotate(angle);

      const mouthSize = 0.25 + Math.abs(Math.sin(pacman.mouth)) * 0.25;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, pacman.r, mouthSize, Math.PI * 2 - mouthSize);
      ctx.closePath();
      ctx.fillStyle = "#ffd93d";
      ctx.fill();

      ctx.restore();

      pacman.mouth += 0.25;
    }

    function drawGhost(ghost) {
      ctx.beginPath();
      ctx.arc(ghost.x, ghost.y, ghost.r, Math.PI, 0);
      ctx.lineTo(ghost.x + ghost.r, ghost.y + ghost.r);
      ctx.lineTo(ghost.x + ghost.r / 2, ghost.y + ghost.r * 0.7);
      ctx.lineTo(ghost.x, ghost.y + ghost.r);
      ctx.lineTo(ghost.x - ghost.r / 2, ghost.y + ghost.r * 0.7);
      ctx.lineTo(ghost.x - ghost.r, ghost.y + ghost.r);
      ctx.closePath();
      ctx.fillStyle = ghost.color;
      ctx.fill();

      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(ghost.x - 5, ghost.y - 2, 3, 0, Math.PI * 2);
      ctx.arc(ghost.x + 5, ghost.y - 2, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "black";
      ctx.beginPath();
      ctx.arc(ghost.x - 5, ghost.y - 2, 1.5, 0, Math.PI * 2);
      ctx.arc(ghost.x + 5, ghost.y - 2, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function updatePacman() {
      pacman.x += pacman.dx;
      pacman.y += pacman.dy;

      if (pacman.x - pacman.r < 0) pacman.x = pacman.r;
      if (pacman.x + pacman.r > canvas.width) pacman.x = canvas.width - pacman.r;
      if (pacman.y - pacman.r < 0) pacman.y = pacman.r;
      if (pacman.y + pacman.r > canvas.height) pacman.y = canvas.height - pacman.r;
    }

    function updateGhosts() {
      ghosts.forEach(ghost => {
        ghost.x += ghost.dx;
        ghost.y += ghost.dy;

        if (ghost.x - ghost.r < 0 || ghost.x + ghost.r > canvas.width) {
          ghost.dx *= -1;
        }

        if (ghost.y - ghost.r < 0 || ghost.y + ghost.r > canvas.height) {
          ghost.dy *= -1;
        }
      });
    }

    let stoppedTime = 0;

function checkCollision() {
  ghosts.forEach(ghost => {
    const dist = Math.hypot(pacman.x - ghost.x, pacman.y - ghost.y);

    if (dist < pacman.r + ghost.r) {
      gameOver = true;
      stoppedTime = Math.floor((Date.now() - startTime) / 1000);
      message.textContent = "잡혔습니다! 새로고침해서 다시 도전하세요 😏";
    }
  });
}

    function checkClear() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);

      if (elapsed >= 10 && !gameClear) {
        gameClear = true;
        message.textContent = "수고하셨습니다만 여기는 정답 페이지가 아닙니다 히히";
      }

      return elapsed;
    }

    function drawTimer(elapsed) {
      ctx.fillStyle = "white";
      ctx.font = "18px Arial";
      ctx.fillText("TIME: " + elapsed + "s", 14, 26);
    }

    function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let elapsed = gameOver ? stoppedTime : Math.floor((Date.now() - startTime) / 1000);

  if (!gameOver && !gameClear) {
    updatePacman();
    updateGhosts();
    checkCollision();

    if (!gameOver) {
  elapsed = checkClear();
}
  }

  drawPacman();
  ghosts.forEach(drawGhost);
  drawTimer(elapsed);

  if (!gameOver && !gameClear) {
    requestAnimationFrame(loop);
  }
}

    document.addEventListener("keydown", (e) => {
      if (gameOver || gameClear) return;

      if (e.key === "ArrowUp") {
        pacman.dx = 0;
        pacman.dy = -pacman.speed;
      } else if (e.key === "ArrowDown") {
        pacman.dx = 0;
        pacman.dy = pacman.speed;
      } else if (e.key === "ArrowLeft") {
        pacman.dx = -pacman.speed;
        pacman.dy = 0;
      } else if (e.key === "ArrowRight") {
        pacman.dx = pacman.speed;
        pacman.dy = 0;
      }
    });

    loop();
  </script>
</body>
</html>
