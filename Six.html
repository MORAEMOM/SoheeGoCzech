<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Six</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 560px;
      text-align: center;
      z-index: 2;
    }

    .box {
      background: #222;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.12);
      line-height: 1.8;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 22px;
    }

    .question {
      font-size: 1.05rem;
      margin-bottom: 18px;
      white-space: pre-line;
    }

    input {
      width: 160px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 14px;
    }

    button {
      display: block;
      margin: 0 auto;
      padding: 10px 24px;
      border: none;
      border-radius: 12px;
      background: #f7f4ef;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ddd;
    }

    .result {
      display: none;
      margin-top: 24px;
      font-size: 1.5rem;
      font-weight: bold;
      line-height: 1.7;
      animation: pop 0.5s ease;
    }

    .firework {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: explode 1.2s ease-out forwards;
      z-index: 1;
    }

    @keyframes explode {
      0% {
        transform: scale(0);
        opacity: 1;
        box-shadow:
          0 0 #ff4d4d,
          0 0 #ffd93d,
          0 0 #6bff95,
          0 0 #4da6ff,
          0 0 #ff7bff;
      }

      100% {
        transform: scale(1);
        opacity: 0;
        box-shadow:
          0 -90px #ff4d4d,
          65px -65px #ffd93d,
          90px 0 #6bff95,
          65px 65px #4da6ff,
          0 90px #ff7bff,
          -65px 65px #ff4d4d,
          -90px 0 #ffd93d,
          -65px -65px #6bff95;
      }
    }

    @keyframes pop {
      0% {
        transform: scale(0.7);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="box" id="quizBox">
      <h1>아래의 값을 더하시오.</h1>

      <div class="question">
시흥대로 57길 [                      ]

강소희가 살고 있는 빌라의 호수

강소희의 신장 cm

종현의 생일이 있는 달
      </div>

      <input type="number" id="answer" placeholder="정답 입력" />
      <button onclick="checkAnswer()">입력</button>

      <div class="result" id="result">
        천재시군요!<br>
        그치만 비밀번호에 6은 없습니다!
      </div>
    </div>
  </div>

  <script>
    function checkAnswer() {
      const answer = document.getElementById("answer").value.trim();

      if (answer === "352") {
        document.getElementById("result").style.display = "block";
        startFireworks();
      } else {
        alert("땡! 다시 계산해보세요 😏");
      }
    }

    function startFireworks() {
      for (let i = 0; i < 18; i++) {
        setTimeout(() => {
          createFirework();
        }, i * 180);
      }
    }

    function createFirework() {
      const firework = document.createElement("div");
      firework.className = "firework";

      firework.style.left = Math.random() * window.innerWidth + "px";
      firework.style.top = Math.random() * window.innerHeight * 0.75 + "px";

      document.body.appendChild(firework);

      setTimeout(() => {
        firework.remove();
      }, 1300);
    }

    document.getElementById("answer").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        checkAnswer();
      }
    });
  </script>
</body>
</html>
