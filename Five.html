<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Five</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f7f4ef;
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      width: 90%;
      max-width: 560px;
      text-align: center;
    }

    .box {
      background: white;
      border: 1px solid #ddd;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 12px;
    }

    .desc {
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .quiz-line {
      font-size: 1.2rem;
      margin: 14px 0;
      letter-spacing: 2px;
    }

    input {
      width: 42px;
      height: 34px;
      text-align: center;
      font-size: 1.1rem;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin: 0 4px;
      transition: all 0.2s ease;
    }

    button {
      margin-top: 22px;
      padding: 10px 22px;
      border: none;
      border-radius: 12px;
      background-color: #333;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #555;
    }

    .merong {
      display: none;
      font-size: 5rem;
      animation: pop 0.5s ease;
    }

    @keyframes pop {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="box" id="quizBox">
      <h1>요즘 유행하는 건데 감쟈는 알려나…?</h1>

      <div class="desc">
        빈자리 단어들을 다 조합해봐
      </div>

      <div class="quiz-line">
        상 세 설 (
        <input type="text" maxlength="1" id="a1">
        )
      </div>

      <div class="quiz-line">
        오 (
        <input type="text" maxlength="1" id="a2">
        )
      </div>

      <div class="quiz-line">
        (
        <input type="text" maxlength="1" id="a3">
        ) 리 가 또
      </div>

      <div class="quiz-line">
        송 곳 (
        <input type="text" maxlength="1" id="a4">
        )
      </div>

      <div class="quiz-line">
        가 운 (
        <input type="text" maxlength="1" id="a5">
        )
      </div>

      <button onclick="checkAnswer()">입력</button>
    </div>

    <div class="merong" id="merong">😜</div>
  </div>

  <script>
    const inputs = [
      document.getElementById("a1"),
      document.getElementById("a2"),
      document.getElementById("a3"),
      document.getElementById("a4"),
      document.getElementById("a5")
    ];
  
    const correct = ["정", "답", "아", "니", "데"];
  
    function validateInput(input, index) {
      const value = input.value.trim();
  
      if (value.length === 1) {
        if (value === correct[index]) {
          input.style.borderColor = "green";
          input.style.backgroundColor = "#e6ffe6";
        } else {
          input.style.borderColor = "red";
          input.style.backgroundColor = "#ffe6e6";
        }
      } else {
        input.style.borderColor = "#ccc";
        input.style.backgroundColor = "white";
      }
      checkAll();
    }
  
    inputs.forEach((input, index) => {
      // 글자 입력 시
      input.addEventListener("input", () => {
        validateInput(input, index);
      });
  
      // 엔터 입력 시
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          validateInput(input, index);
        }
      });
    });
    function checkAll() {
  const allCorrect = inputs.every((input, index) =>
    input.value.trim() === correct[index]
  );

  if (allCorrect) {
    document.getElementById("quizBox").style.display = "none";
    document.getElementById("merong").style.display = "block";
  }
}
  </script>
</body>
</html>
